# Hosted watch of /live through the Grand Final, 2026-09-13.
#
# The local watcher only runs while this Mac is awake. `pmset -g` on 2026-09-10
# still reports `sleep 1` - one minute of idle - held off only by other lanes'
# `caffeinate` processes, each asserting for 300 seconds at a time. If nobody is
# working on the night, the machine sleeps a minute later and the watcher with
# it, and that silence reads exactly like a quiet night.
#
# This runs the same probe from GitHub instead. It needs no new credential: it
# reads our own public endpoints, and a FAILED scheduled run is reported by
# GitHub to the account that last changed the cron below - which CAN reach a
# phone, the one thing the local watcher cannot do.
#
# BUT THAT DELIVERY PATH WAS MEASURED 2026-09-12 AND IT DOES NOT ARRIVE. The
# dispatch test ran (34714552200) and failed as designed and NO NOTIFICATION CAME -
# that half is measured. The CAUSE is reported by the dotfiles lane and not verified
# here: the account has neither email nor GitHub Mobile notifications enabled.
# So until that is turned on, every probe below can fire correctly and a real
# outage still reaches nobody - the run failing and the alert being delivered are
# two separate things, and only the first one works. See docs/LIVE-WATCH.md.
#
# Fails the run on ALERT only. Info (no battle running) and warn (slow, stale)
# pass with an annotation, so the only notification is one worth reading.
#
# RE-CHECKED 2026-09-17, and THE CLAIM CHANGED rather than the date.
#
# This used to say "delete this file, it is scoped to one event". That was right
# when the whole file was event-scoped. It is not right now, and two measurements
# say why.
#
# First, the event never happened. The Grand Final was moved off the 13th and then
# cancelled outright (Zaal, 2026-09-13: "it moved to next week", then "Cancel it"),
# so every schedule below is pointed at a night that did not occur.
#
# Second, the schedules are NOT recurring clutter, which is what the old claim
# assumed. Every cron here carries a month field of 9, so they do not fire monthly
# - the next firing of `17 * 11-12 9 *` is 2027-09-11. Checked rather than assumed,
# because "it will fire again next month" was my first reading and it was wrong.
#
# So the scheduled half is dead until next September and aimed at nothing, while
# `workflow_dispatch` is the half that has actually been used - it is how the
# alert-delivery test ran on 2026-09-12 (dispatch 34714552200), which is what
# established that the run fails correctly and notifies nobody.
#
# The schedules are removed and the dispatch is kept. Deleting the file would
# throw away the working half to tidy the dead one.
#
# INVALIDATED BY: a rescheduled final, which needs new cron dates rather than this
# file back. RE-CHECK BY 2026-10-17.
name: live-watch

on:
  # No schedule. The three crons that were here covered the 11th to the 14th of
  # September for a final that was cancelled; they are in git history if a
  # rescheduled event ever wants them as a starting point. Re-adding a schedule
  # means picking dates for an event that exists, not restoring these.
  workflow_dispatch:
    inputs:
      base:
        description: "Deployment to probe. Point it at a path that 404s to test the alert reaches you."
        default: "https://wwtracker.vercel.app"
        required: true
      minutes:
        description: "0 = one probe. N = probe every 60s for N minutes (max 340), failing at the first ALERT."
        default: "0"
        required: true

# Never two probes racing; a slow one is allowed to finish rather than cancelled.
concurrency:
  group: live-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: probe /live and /api/ww/positions
    runs-on: ubuntu-latest
    # Room for the dispatched loop (340 min) - scheduled single probes still
    # finish in seconds.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/live-watch.mjs
            lib/liveWatch.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: probe
        env:
          BASE: ${{ github.event.inputs.base || 'https://wwtracker.vercel.app' }}
          MINUTES: ${{ github.event.inputs.minutes || '0' }}
        run: |
          # The hardcoded expiry that used to live here is gone with the schedules
          # it was guarding, and removing it was NOT tidying - it had become a
          # trap. It skipped any scheduled run dated after 2026-09-14, so the
          # moment someone re-added a schedule for a rescheduled final it would
          # have silently no-opped every probe while the workflow still went
          # green. A guard outliving the thing it guards is worse than no guard,
          # because it is invisible and it reads as passing.
          #
          # Nothing is scheduled now, so there is nothing to expire. If a schedule
          # is ever added back, it needs dates for an event that exists - and no
          # expiry unless that event has an end.
          # MINUTES > 0 is the dispatched loop - the path to rely on during the
          # final, because GitHub's scheduler is not. Measured 2026-09-11: the
          # daily checks.yml schedule (08:30 UTC) has fired 4-6 hours late every
          # day, and this workflow's first two hourly slots produced no run at
          # all. RE-MEASURED 2026-09-12 21:0x over 45 elapsed hourly slots: 11
          # runs fired (24.4%), gaps of 2.2 to 5.1 hours, so the effective cadence
          # is one run per 3.9 hours against a cron asking for one per hour.
          #
          # AND THE */5 WINDOW IS NOW MEASURED, 2026-09-13 01:43 UTC: ZERO runs in
          # its first 1h43m, against 20 promised. So the effective cadence holds
          # whatever the cron asks - about 2 probes across the 8-hour window, not
          # the 96 promised and not the 23 a constant-drop-rate model predicted.
          # Worse, the hourly cron above is scoped to days 11-12, so from 00:00Z on
          # the 13th */5 is the ONLY schedule and it has fired nothing: the watch is
          # DARK during the window it exists for, and nothing looks broken from
          # outside. A run started by hand, probing every 60s, does not wait on any
          # of that - it is the only coverage there is.
          MINUTES="${MINUTES:-0}"
          if [ "$MINUTES" -gt 340 ]; then MINUTES=340; fi
          # A DEADLINE, not a count, on purpose. A slow probe (up to ~10s with
          # retries) then means fewer probes, never a longer run - so the job
          # always ends inside its 350-minute timeout. A counted loop of N
          # probes would run N x (60s + probe time) and could be killed by the
          # timeout mid-watch, silently. Do not "fix" this into a counter.
          end=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            set +e
            node scripts/live-watch.mjs --base "$BASE" --log var/live-watch.log | tee -a out.txt
            code=${PIPESTATUS[0]}
            set -e
            case "$code" in
              # 1 is the watcher's INFO level: NOT_RUNNING (no battle in
              # progress - normal between battles), TRUNCATED (a side hit the
              # 20-holder read cap) or FLAPPED (failed, then recovered). Each is
              # printed on its line above and kept in the summary; none is a
              # reason to page anyone, so it passes quietly by design.
              0|1) ;;
              2) echo "::warning::live-watch WARN - see the lines above" ;;
              *) { echo '```'; tail -40 out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                 echo "::error::live-watch ALERT (exit $code) - /live or its route is failing"; exit 1 ;;
            esac
            [ "$(date +%s)" -ge "$end" ] && break
            sleep 60
          done
          { echo '```'; tail -40 out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
