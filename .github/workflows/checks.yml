# Two checks that had no home.
#
# Both already existed and neither ever ran. `validate.mjs --strict` turns
# staleness into a failure and was invoked nowhere in the repo - the 45-day
# gate that docs/AUDIT.md lists among the things that are genuinely solid could
# not fire. `smoke:stats` asserts the upstream wavewarz.info contract still
# holds and was a command you had to remember to type.
#
# Deliberately NOT in `prebuild`. Data staleness must not block an unrelated
# code deploy, and making our deploys depend on a third party's uptime is the
# coupling this repo exists to avoid. Failing loudly here costs nothing and
# blocks nothing.
name: checks

# One run per ref. A new push cancels the old run instead of leaving two
# builds racing to report on the same branch, which is how a stale red or
# green ends up next to a commit it does not describe.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 08:30 UTC, half an hour ahead of the treasury cron in vercel.json, so a
    # broken upstream contract is visible before the refresh runs against it.
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  build:
    name: types, tests, data
    runs-on: ubuntu-latest
    # issues: write is for the overdue re-check issue below, and only that step
    # uses it. Everything else here is read-only.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, not 20: the runner forces Node 20 actions onto 24 already and
          # annotates every run about it. Local dev is on 23.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # --strict: stale data fails here even though it never fails a deploy.
      # Datasets knowingly parked carry an expiry date in the script itself.
      # An OVERDUE re-check date does NOT fail here (it used to, which turned
      # main red at midnight with no code change). It is printed, annotated on
      # the file, written to the job summary, and kept in one issue below.
      - run: node scripts/validate.mjs --strict --recheck-report "$RUNNER_TEMP/recheck.md"

      # The loud half of that trade. One issue, titled exactly as below, holds
      # every overdue claim; it is rewritten on each run on main or the daily
      # schedule and closed when nothing is overdue. Not on pull_request: a PR
      # from a fork has no write token, and PRs should not race each other on
      # one issue body. If this step cannot reach the API it fails the job,
      # because an overdue claim nobody can see is the silent pass this replaced.
      - name: Keep the overdue re-check issue current
        if: github.event_name != 'pull_request' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/recheck.md"
          if [ ! -f "$REPORT" ]; then
            echo "validate.mjs did not run, so there is no report. Leaving the issue alone."
            exit 0
          fi
          TITLE="Overdue RE-CHECK claims"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -s "$REPORT" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file "$REPORT"
              echo "Updated issue #$NUM"
            else
              gh issue create --title "$TITLE" --body-file "$REPORT"
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Nothing is overdue as of run ${{ github.run_id }}. Closing."
          else
            echo "Nothing overdue and no open issue."
          fi
      - run: npm run check:review

  upstream-contract:
    name: upstream stats API contract
    # Schedule and manual only. This calls wavewarz.info, and a PR should not
    # go red because someone else's API had a bad minute.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:stats
