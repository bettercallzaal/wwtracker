<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaveWarZ - Live Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Transparent page: composites over video in Restream/OBS browser source.
     Live data pulled from wavewarz.info/api/public/stats every 30s.
     URL params ?left= and ?right= still work as a manual override. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; height:100%; }

  :root { --gold:#FFC93C; --ink:#ffffff; --glass:rgba(10,12,16,0.78); --red:#ff4444; }

  .bar {
    position:fixed; left:50%; bottom:6vh; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:10px;
    padding:14px 26px 12px 18px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:14px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,0.45);
    white-space:nowrap;
  }
  .row { display:flex; align-items:center; gap:22px; }

  .logo { display:flex; align-items:center; }
  .logo img { height:48px; width:auto; display:block; }
  .logo .fallback {
    font-family:'Anton', sans-serif; font-size:28px; letter-spacing:0.04em;
    color:var(--ink); display:none;
  }

  .live {
    display:flex; align-items:center; gap:8px;
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:12px; letter-spacing:0.22em; color:var(--ink);
  }
  .live .dot {
    width:9px; height:9px; border-radius:50%; background:var(--gold);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .live.standby .dot { background:rgba(255,255,255,0.35); animation:none; }
  @keyframes pulse {
    0%, 100% { opacity:1; box-shadow:0 0 0 0 rgba(255,201,60,0.55); }
    50%       { opacity:0.55; box-shadow:0 0 0 7px rgba(255,201,60,0); }
  }

  .matchup { display:flex; align-items:baseline; gap:14px;
    font-family:'Anton', sans-serif; color:var(--ink); }
  .matchup .name { font-size:32px; letter-spacing:0.03em; line-height:1; }
  .matchup .vs   { font-size:18px; color:var(--gold); letter-spacing:0.08em; }

  .eq { display:flex; align-items:flex-end; gap:3px; height:24px; }
  .eq span { width:4px; background:var(--gold); border-radius:2px;
    transform-origin:bottom; animation:eq 1.1s ease-in-out infinite; }
  .eq span:nth-child(1){ height:40%; animation-delay:0s;    }
  .eq span:nth-child(2){ height:80%; animation-delay:0.15s; }
  .eq span:nth-child(3){ height:55%; animation-delay:0.3s;  }
  .eq span:nth-child(4){ height:95%; animation-delay:0.08s; }
  .eq span:nth-child(5){ height:60%; animation-delay:0.22s; }
  @keyframes eq { 0%,100%{transform:scaleY(0.5);} 50%{transform:scaleY(1.05);} }

  /* Standby: dim the eq bars when no live battle */
  .eq.standby span { background:rgba(255,255,255,0.2); animation:none; transform:scaleY(0.4); }

  /* Stats strip */
  .stats {
    display:flex; align-items:center; gap:20px;
    font-family:'Space Grotesk', sans-serif; font-size:12px;
    letter-spacing:0.12em; color:rgba(255,255,255,0.65); text-transform:uppercase;
    border-top:1px solid rgba(255,255,255,0.08); padding-top:9px;
  }
  .stats b {
    font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums;
    transition:color 0.4s ease;
  }
  .stats b.flash { color:var(--gold); }
  .stats .tag { color:rgba(255,255,255,0.4); }
  /* Countdown flashes red in last 60s */
  #countdown.urgent { color:var(--red) !important; animation:blink 1s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  @media (prefers-reduced-motion: reduce) {
    .live .dot { animation:none; }
    .eq span   { animation:none; transform:none; }
    #countdown.urgent { animation:none; }
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="row">
      <div class="logo">
        <img src="https://wavewarz.com/images/battles/WaveWarZLogoFinal.PNG" alt="WaveWarZ"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="fallback">WAVEWARZ</span>
      </div>
      <div class="live" id="liveIndicator"><span class="dot"></span><span id="liveLabel">LIVE</span></div>
      <div class="matchup">
        <span class="name" id="left">ARTIST A</span>
        <span class="vs">VS</span>
        <span class="name" id="right">ARTIST B</span>
      </div>
      <div class="eq" id="eqBars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="stats">
      <span><b id="vol">--</b> SOL <span class="tag">TOTAL VOL</span></span>
      <span><b id="battles">--</b> <span class="tag">BATTLES</span></span>
      <span><b id="vol24">--</b> SOL <span class="tag">24H VOL</span></span>
      <span id="subwrap"><b id="countdown" class="tag">--</b></span>
    </div>
  </div>

<script>
  (function () {
    var STATS_URL = 'https://wavewarz.info/api/public/stats';
    var POLL_MS = 30000;

    // URL param manual overrides for artist names
    var q = new URLSearchParams(location.search);
    var manualLeft  = q.get('left')  ? q.get('left').toUpperCase()  : null;
    var manualRight = q.get('right') ? q.get('right').toUpperCase() : null;

    var prev = {};
    var countdownInterval = null;
    var endsAt = null;
    var isLive = false;

    function put(id, value) {
      var el = document.getElementById(id);
      if (!el || el.textContent === value) return;
      el.textContent = value;
      if (prev[id] !== undefined) {
        el.classList.add('flash');
        setTimeout(function () { el.classList.remove('flash'); }, 1200);
      }
      prev[id] = value;
    }

    function fmtSol(n) {
      return n >= 100 ? n.toFixed(1) : n.toFixed(2);
    }

    function setLiveState(live) {
      var indicator = document.getElementById('liveIndicator');
      var label = document.getElementById('liveLabel');
      var eq = document.getElementById('eqBars');
      if (live) {
        indicator.classList.remove('standby');
        label.textContent = 'LIVE';
        eq.classList.remove('standby');
      } else {
        indicator.classList.add('standby');
        label.textContent = 'STANDBY';
        eq.classList.add('standby');
      }
      isLive = live;
    }

    function updateCountdown() {
      if (!endsAt) { document.getElementById('countdown').textContent = 'BACK MUSIC, NOT MEMES.'; return; }
      var secsLeft = Math.max(0, Math.floor((new Date(endsAt) - Date.now()) / 1000));
      var el = document.getElementById('countdown');
      if (secsLeft <= 0) {
        el.textContent = 'SETTLING...';
        el.classList.remove('urgent');
        return;
      }
      var m = Math.floor(secsLeft / 60);
      var s = secsLeft % 60;
      el.textContent = 'ENDS IN ' + m + ':' + (s < 10 ? '0' : '') + s;
      if (secsLeft <= 60) el.classList.add('urgent');
      else el.classList.remove('urgent');
    }

    function applyStats(data) {
      // Volume + battles from stats
      if (data.volume && data.volume.totalSol != null) {
        put('vol', fmtSol(data.volume.totalSol));
      }
      if (data.battles && data.battles.total != null) {
        put('battles', String(data.battles.total));
      }
      if (data.volume && data.volume.last24hSol != null) {
        put('vol24', fmtSol(data.volume.last24hSol));
      }

      var lb = data.liveBattle;
      if (lb) {
        setLiveState(true);
        endsAt = lb.endsAt || null;
        if (countdownInterval) clearInterval(countdownInterval);
        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 1000);

        // Manual override wins; otherwise use live battle names
        var leftName  = manualLeft  || (lb.artist1 && lb.artist1.name ? lb.artist1.name.toUpperCase() : 'ARTIST A');
        var rightName = manualRight || (lb.artist2 && lb.artist2.name ? lb.artist2.name.toUpperCase() : 'ARTIST B');
        put('left', leftName);
        put('right', rightName);
      } else {
        setLiveState(false);
        endsAt = null;
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        document.getElementById('countdown').textContent = 'BACK MUSIC, NOT MEMES.';
        document.getElementById('countdown').classList.remove('urgent');

        // Manual override wins; otherwise show placeholder
        put('left',  manualLeft  || 'ARTIST A');
        put('right', manualRight || 'ARTIST B');
      }
    }

    function refresh() {
      fetch(STATS_URL, { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(applyStats)
        .catch(function () {});
    }

    refresh();
    setInterval(refresh, POLL_MS);
  })();
</script>
</body>
</html>
